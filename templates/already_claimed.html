<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8726 | Restricted Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #04003b; 
            color: #ffffff; 
            font-family: 'Montserrat', sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
            box-sizing: border-box; 
            text-align: center;
            text-transform: uppercase;
        }
        .error-box { 
            border: 4px solid #9e9d9d; 
            padding: 40px 20px; 
            background: #000000; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8); 
            width: 100%; 
            max-width: 400px;
            border-radius: 15px;
        }
        h1 { 
            font-size: 2.2rem; 
            margin-top: 0;
            margin-bottom: 10px; 
            color: #ffffff;
        }
        .warning { 
            color: #9e9d9d; 
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin: 20px 0; 
        }
        p {
            color: #c0c0c0;
            font-size: 0.95rem;
            line-height: 1.5;
            text-transform: none; /* Keeps paragraph text easier to read on phones */
            margin-bottom: 10px;
        }
        .blink { animation: blinker 1.5s linear infinite; }
        @keyframes blinker { 50% { opacity: 0.1; } }
        
        a { 
            color: #04003b; 
            text-decoration: none; 
            padding: 15px; 
            margin-top: 20px; 
            display: block;
            background: #ffffff;
            font-weight: bold;
            border-radius: 5px;
            transition: 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        a:active { 
            background: #c0c0c0; 
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1 class="blink">LOCKOUT</h1>
        <div class="warning">DUPLICATE TRANSACTION</div>
        <p>This device has already invested its 100 Talons.</p>
        <p>48-Hour Cooldown Protocol Active.</p>
        <a href="/">RETURN TO TERMINAL</a>
    </div>
</body>
</html>
