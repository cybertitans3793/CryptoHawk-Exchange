<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8726 | Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: #04003b; color: white; font-family: 'Montserrat', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .receipt-card { background: #000; border: 4px solid #9e9d9d; padding: 30px 20px; border-radius: 15px; box-shadow: 0 0 30px rgba(0,0,0,0.8); text-align: center; width: 100%; max-width: 400px; }
        .check { font-size: 4rem; color: #9e9d9d; margin-bottom: 5px; }
        h1 { font-size: 1.5rem; margin-bottom: 25px; letter-spacing: 1px; }
        .data-row { display: flex; justify-content: space-between; margin: 15px 0; border-bottom: 1px solid #333; padding-bottom: 8px; font-size: 1rem; }
        .label { color: #9e9d9d; text-transform: uppercase; font-size: 0.85rem; }
        .total-box { background: #04003b; margin-top: 25px; padding: 20px; border: 1px solid #9e9d9d; border-radius: 8px; }
        .total-val { font-size: 1.8rem; display: block; margin-top: 5px; color: #ffffff; }
        .btn { display: block; background: #ffffff; color: #04003b; text-decoration: none; padding: 15px; margin-top: 25px; font-weight: bold; text-transform: uppercase; border-radius: 5px; transition: 0.3s; }
        .btn:active { background: #c0c0c0; }
        .return-link { color: #9e9d9d; display: block; margin-top: 20px; font-size: 0.9rem; text-decoration: none; padding: 10px; }
    </style>
</head>
<body>
    <div class="receipt-card">
        <div class="check">✓</div>
        <h1>TRANSACTION SUCCESS</h1>

        <div class="data-row">
            <span class="label">Team</span>
            <span>{{ team }}</span>
        </div>
        <div class="data-row">
            <span class="label">Invested</span>
            <span>100 Talons</span>
        </div>
        <div class="data-row">
            <span class="label">Acquired</span>
            <span>+{{ added }} HB</span>
        </div>

        <div class="total-box">
            <span class="label">Net Worth (Talons)</span>
            <span class="total-val">{{ "%.2f"|format(total * price) }}</span>
        </div>

        <a href="/tv" class="btn">View Live Rankings</a>
        <a href="/" class="return-link">Return to Terminal</a>
    </div>
</body>
